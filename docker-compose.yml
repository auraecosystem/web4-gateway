services:
 gateway:
  build: .
  restart: unless-stopped
  environment:
   NODE_ENV: production
   HOST: 0.0.0.0
   PORT: 3000
   GATEWAY_TOKEN: ${GATEWAY_TOKEN:?Set GATEWAY_TOKEN}
   ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS}
   SESSION_TTL_SECONDS: 60
   HEARTBEAT_INTERVAL_MS: 30000
   MAX_PAYLOAD_BYTES: 1048576
   TRUST_PROXY_HOPS: 1
  expose: ["3000"]
  networks: [web4-private]
  healthcheck:
   test: ["CMD","node","-e","fetch('http://127.0.0.1:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
   interval: 30s
   timeout: 5s
   retries: 3
 nginx:
  image: nginx:1.27-alpine
  restart: unless-stopped
  depends_on:
   gateway: {condition: service_healthy}
  ports: ["80:80","443:443"]
  volumes:
   - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
   - ./certs:/etc/nginx/certs:ro
  networks: [web4-private]
networks:
 web4-private: {driver: bridge}
