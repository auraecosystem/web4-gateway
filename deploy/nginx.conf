map $http_upgrade $connection_upgrade { default upgrade; '' close; }
limit_req_zone $binary_remote_addr zone=ws_handshake:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=ws_clients:10m;
upstream web4_gateway_backend { least_conn; server gateway:3000; keepalive 32; }
server { listen 80; server_name gateway.example.com; return 301 https://$host$request_uri; }
server {
 listen 443 ssl; http2 on; server_name gateway.example.com;
 ssl_certificate /etc/nginx/certs/fullchain.pem; ssl_certificate_key /etc/nginx/certs/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3; ssl_session_timeout 1d; ssl_session_cache shared:Web4TLS:10m; ssl_session_tickets off;
 add_header Strict-Transport-Security "max-age=31536000" always;
 location = /api/healthz { proxy_pass http://web4_gateway_backend/api/healthz; access_log off; }
 location = /api/readyz { proxy_pass http://web4_gateway_backend/api/readyz; allow 127.0.0.1; deny all; }
 location = /ws {
  limit_req zone=ws_handshake burst=20 nodelay;
  limit_conn ws_clients 20;
  access_log off;
  proxy_pass http://web4_gateway_backend;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_read_timeout 3600s; proxy_send_timeout 3600s; proxy_buffering off;
 }
 location / {
  proxy_pass http://web4_gateway_backend;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
 }
}
